[project]
name = "suanlinfang-sdk"
version = "0.3.1"
description = "算邻坊开放 API Python 客户端（文生图 / 语音识别 / 语音合成 / 文字识别）"
readme = "README.md"
authors = [{ name = "SuanLinFang" }]
keywords = ["suanlinfang", "image-generation", "stt", "tts", "ocr", "speech-recognition", "text-to-speech"]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://suanlinfang.cn"
Documentation = "https://suanlinfang.cn/www/index.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["suanlinfang"]
